<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Google Fonts-->
    <link rel="preconnet" href="https://fonts.googleapis.com">
    <link rel="preconnet" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">

    <!--Hojas de estilos-->
    <link rel="stylesheet" href="styles.css">

    <!--Favicon-->
    <link rel="icon" type="imagine/svg" href="./logos/favicon.svg">


    <title>Interfaz de login</title>
</head>

<body>
    <div class="login">
        <div class="form-container">
            <img src="./logos/logo.svg" alt="logo" class="logo">

            <form action="/" class="form">
                <label for="email" class="label">Email address</label>
                <input type="email" id="password" placeholder="email@uniboyaca.edu.co" class="input input-password">

                <label for="new-password" class="label">Password</label>
                <input type="password" id="new-password" placeholder="***********" class="input input-password">
                <input type="submit" value="Log in" class="primary-button login-button">
                <p class="forgot"><a>Forgot my password</a></p>
                <br>
                <br>
                <input type="submit" value="Sign up" class="button-sign-up">
            </form>

        </div>
    </div>
</body>

</html>
